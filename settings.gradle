pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // GravityDockSDK 发布所在的 Gravity Engine Nexus Maven 仓库
        maven {
            url "https://nexus.gravity-engine.com/repository/maven-releases/"
        }
        maven {
            url "https://nexus.gravity-engine.com/repository/maven-snapshots/"
        }
    }
}

rootProject.name = "GravityDock-Android-Demo"
include ':app'
